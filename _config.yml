# GitHub Pages (legacy / branch source) runs Jekyll over this repository even though the site is
# plain static HTML: no layouts, no _posts, nothing to render.
#
# HD2's Diary moved to its own repository (HyangDan2/diary) and is served at /diary/ from there,
# so this tree now holds only the Web-HQ portal and the pages it owns.
#
# Keep Jekyll's default exclusions so build-only files never reach the published tree.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
