<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>PKPilot0002 단위 테스트</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      padding: 28px;
      background: #101110;
      color: #f2f1eb;
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.meta { color: #a4a79e; margin: 0 0 18px; font-size: 12.5px; }
    ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
    li { display: flex; gap: 8px; align-items: baseline; padding: 5px 9px; border-radius: 7px; background: #1b1d1a; }
    li.fail { background: rgba(255, 122, 107, 0.12); border: 1px solid rgba(255, 122, 107, 0.4); }
    .mark { font-weight: 800; }
    li.ok .mark { color: #7ddba3; }
    li.fail .mark { color: #ff7a6b; }
    .ms { margin-left: auto; color: #7a7e73; font-size: 11px; font-variant-numeric: tabular-nums; }
    .err { display: block; color: #ff9f9f; font-size: 12px; margin-top: 2px; }
    #summary { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: #1b1d1a; font-weight: 700; }
    #summary.pass { color: #7ddba3; border: 1px solid rgba(125, 219, 163, 0.4); }
    #summary.fail { color: #ff7a6b; border: 1px solid rgba(255, 122, 107, 0.45); }
  </style>
</head>
<body>
  <h1>PKPilot0002 · Midpoint 단위 테스트</h1>
  <p class="meta">core.js — 거리·중간 지점·공평도·URL 상태·역 추천</p>
  <ul id="list"><li>실행 중…</li></ul>
  <p id="summary">실행 중…</p>

  <script type="module">
    import './core.test.js';
    import { runAll } from './harness.js';

    const results = await runAll();
    const passed = results.filter(r => r.ok).length;
    const failed = results.length - passed;
    const list = document.getElementById('list');
    const summary = document.getElementById('summary');

    list.innerHTML = results.map(r => `
      <li class="${r.ok ? 'ok' : 'fail'}">
        <span class="mark">${r.ok ? '✓' : '✗'}</span>
        <span>${r.name}${r.ok ? '' : `<span class="err">${r.error}</span>`}</span>
        <span class="ms">${r.ms.toFixed(1)}ms</span>
      </li>`).join('');

    summary.textContent = failed === 0
      ? `${passed}개 테스트 모두 통과`
      : `${failed}개 실패 / ${results.length}개 중`;
    summary.className = failed === 0 ? 'pass' : 'fail';

    window.__PKP_TEST__ = { done: true, total: results.length, passed, failed, results };
  </script>
</body>
</html>
