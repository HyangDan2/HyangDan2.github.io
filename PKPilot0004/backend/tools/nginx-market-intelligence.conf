# HD2Lab Market Intelligence (PKPilot0004 backend) · Nginx 서브패스 예시
# 실제 반영 전 `nginx -t` 로 검사하고, 기존 /HD2Lab 라우팅은 건드리지 않는다.
# 공개 범위는 이 초안에서 "읽기 전용 공개"를 전제로 한다. 관리자 전용으로 돌릴 때는
# 맨 아래 auth_request 주석을 참고해 기존 공통 SSO 경계를 재사용한다.
#
# 전제: 백엔드는 `MI_ROOT_PATH=/market-intel` 로 실행한다. FastAPI 의 root_path 는
# 문서·OpenAPI URL 생성용이고, 라우팅은 접두사가 **제거된** 경로(/api/health)로 매칭된다.
# 그래서 Nginx 는 항상 접두사를 떼고 넘긴다(proxy_pass 에 URI 를 주는 방식).
# 정규식 location 안에서는 proxy_pass 에 URI 를 쓸 수 없으므로, 캐시가 필요한
# 경로는 정규식 대신 exact(=/prefix) 또는 ^~ 접두사 location 으로 분리한다.

upstream hd2lab_market_intel {
    server 127.0.0.1:8791;
    keepalive 8;
}

# 무료 API 호출을 대신하는 캐시. 서버 재시작 후에도 폴더가 남아 스탬피드를 줄인다.
proxy_cache_path /var/cache/nginx/market-intel levels=1:2 keys_zone=mi_cache:8m
                 max_size=64m inactive=30m use_temp_path=off;

limit_req_zone $binary_remote_addr zone=mi_req:10m rate=30r/m;

server {
    listen 443 ssl http2;
    server_name hd2lab.duckdns.org;
    # ssl_certificate ... (기존 서버 설정 유지)

    location = /market-intel {
        return 308 /market-intel/;
    }

    # ── 캐시 가능한 경로(5분) ─────────────────────────────────────────────
    location = /market-intel/api/factors {
        limit_req zone=mi_req burst=20 nodelay;
        proxy_pass http://hd2lab_market_intel/api/factors;
        proxy_set_header Host $host;
        proxy_cache mi_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_key "$scheme$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
    }

    location = /market-intel/api/health {
        limit_req zone=mi_req burst=20 nodelay;
        proxy_pass http://hd2lab_market_intel/api/health;
        proxy_set_header Host $host;
        proxy_cache mi_cache;
        proxy_cache_valid 200 1m;
        proxy_cache_key "$scheme$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
    }

    location ^~ /market-intel/static/ {
        limit_req zone=mi_req burst=20 nodelay;
        proxy_pass http://hd2lab_market_intel/static/;
        proxy_set_header Host $host;
        proxy_cache mi_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_key "$scheme$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ── 나머지(대시보드 HTML · /api/analyze · /api/symbols) ───────────────
    location /market-intel/ {
        limit_req zone=mi_req burst=20 nodelay;
        proxy_pass http://hd2lab_market_intel/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;

        # /api/analyze 는 캐시하지 않는다(종목별 최신성 + 캐시 키 폭발 방지).

        # --- 공통 SSO로 보호하려면 아래를 켜고 상단 location 의 limit_req 를 유지한다.
        # auth_request /internal/admin-auth/verify;
        # error_page 401 = @admin_login;
    }

    # CORS 는 애플리케이션(market_intel/app.py 의 CORSMiddleware)이 응답 헤더로 낸다.
    # Nginx 에서 Access-Control-Allow-Origin 을 또 붙이면 헤더가 중복되어 브라우저가 막는다.
    # 허용 출처는 MI_CORS_ORIGINS 로 관리한다(기본값에 https://hyangdan2.github.io 포함).

    # location = /internal/admin-auth/verify {
    #     internal;
    #     proxy_pass http://unix:/run/hd2lab-admin-auth/auth.sock:/verify;
    # }
    # location @admin_login { return 302 /admin/login?next=$request_uri; }
}
